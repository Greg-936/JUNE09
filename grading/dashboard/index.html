<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Grading Management System</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --navy:#1e3a5f;--navy-dark:#152d4a;--navy-mid:#2a4f7a;
      --bg:#f0f4f8;--surface:#fff;--border:#d1d9e6;
      --text:#1a202c;--text-mid:#374151;--text-muted:#64748b;--text-light:#94a3b8;
      --radius:8px;--shadow-sm:0 1px 3px rgba(0,0,0,.08);
      --shadow:0 2px 12px rgba(0,0,0,.08);--shadow-lg:0 4px 24px rgba(0,0,0,.12);
      --font:'Inter',system-ui,-apple-system,sans-serif;--transition:180ms ease;
    }
    html{font-size:16px}
    body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh}
    ::-webkit-scrollbar{width:6px;height:6px}
    ::-webkit-scrollbar-track{background:#f1f4f8}
    ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}

    .app-shell{min-height:100vh;display:flex;flex-direction:column}

    /* Topnav */
    .topnav{background:var(--navy);color:#fff;padding:0 32px;height:64px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.2);position:sticky;top:0;z-index:100}
    .topnav-brand{display:flex;align-items:center;gap:14px}
    .topnav-logo{width:40px;height:40px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;letter-spacing:1px;flex-shrink:0}
    .topnav-title{font-size:16px;font-weight:700;line-height:1.2}
    .topnav-sub{font-size:11px;color:rgba(255,255,255,.6);margin-top:1px}
    .topnav-right{display:flex;align-items:center;gap:12px}
    .welcome-badge{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:5px 14px;font-size:13px;font-weight:500;color:rgba(255,255,255,.9)}
    .dark-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:6px;padding:6px 12px;font-size:12px;font-weight:600;color:#fff;cursor:pointer;transition:var(--transition);display:flex;align-items:center;gap:5px}
    .dark-btn:hover{background:rgba(255,255,255,.2)}

    /* Dark mode */
    .dark-mode{--bg:#0f172a;--surface:#1e293b;--border:#334155;--text:#f1f5f9;--text-mid:#cbd5e1;--text-muted:#94a3b8;--text-light:#64748b}
    .dark-mode .topnav{background:#0f172a}
    .dark-mode .stat-card,.dark-mode .table-card,.dark-mode .card{background:#1e293b}
    .dark-mode .table-row:hover{background:#293548}
    .dark-mode thead th{background:#1a2744}
    .dark-mode input,.dark-mode select{background:#1e293b;color:#f1f5f9;border-color:#475569}
    .dark-mode .back-btn{background:#1e293b;color:#cbd5e1;border-color:#334155}
    .dark-mode .btn-outline{background:#1e293b;color:#cbd5e1;border-color:#334155}
    .dark-mode .btn-outline:hover{background:#293548}
    .dark-mode .comments-toggle-btn{color:#f1f5f9}
    .dark-mode .comments-toggle-btn:hover{background:#293548}
    .dark-mode .meta-row-item{border-color:#334155}
    .dark-mode .criteria-row td{border-color:#334155}
    .dark-mode .page-btn{background:#1e293b;color:#cbd5e1;border-color:#334155}
    .dark-mode .page-btn:hover{background:#293548}

    /* Page */
    .page{padding:28px 32px 48px;max-width:1280px;margin:0 auto;width:100%;flex:1}
    .page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}
    .page-title{font-size:22px;font-weight:800;color:var(--text)}
    .page-sub{font-size:13px;color:var(--text-muted);margin-top:2px}

    /* Stats */
    .stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
    .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow-sm);display:flex;align-items:center;gap:14px}
    .stat-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
    .stat-val{font-size:26px;font-weight:800;line-height:1}
    .stat-lbl{font-size:12px;color:var(--text-muted);font-weight:500;margin-top:2px}

    /* Toolbar */
    .toolbar{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
    .search-wrap{position:relative;flex:1;min-width:200px;max-width:340px}
    .search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-light);pointer-events:none}
    .search-input{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);font-family:var(--font);font-size:13px;transition:border-color var(--transition)}
    .search-input:focus{outline:none;border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.15)}
    .filter-select{padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);font-family:var(--font);font-size:13px;cursor:pointer}
    .filter-select:focus{outline:none;border-color:#3b82f6}

    /* Buttons */
    .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border:none;border-radius:var(--radius);font-family:var(--font);font-size:13px;font-weight:600;cursor:pointer;transition:var(--transition);line-height:1;white-space:nowrap}
    .btn-primary{background:var(--navy);color:#fff}
    .btn-primary:hover{background:var(--navy-mid)}
    .btn-success{background:#10b981;color:#fff}
    .btn-success:hover{background:#059669}
    .btn-outline{background:var(--surface);color:var(--text-mid);border:1px solid var(--border)}
    .btn-outline:hover{background:var(--bg)}
    .btn-sm{padding:5px 10px;font-size:12px}
    .btn-view{background:var(--navy);color:#fff}
    .btn-view:hover{background:var(--navy-mid)}
    .btn-pdf{background:#dc2626;color:#fff}
    .btn-pdf:hover{background:#b91c1c}

    /* Table */
    .table-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
    .table-scroll{overflow-x:auto}
    table{width:100%;border-collapse:collapse;font-size:13.5px}
    thead th{background:#f8fafc;padding:11px 16px;text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--text-muted);border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none}
    thead th:hover{color:var(--navy)}
    .th-sort{display:flex;align-items:center;gap:4px}
    .table-row{border-bottom:1px solid #f1f5f9;transition:background var(--transition)}
    .table-row:last-child{border-bottom:none}
    .table-row:hover{background:#f8fafc}
    td{padding:12px 16px;vertical-align:middle}
    .td-name{font-weight:600;color:var(--text)}
    .td-project{color:var(--text-muted);font-size:12.5px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .td-actions{display:flex;gap:6px;align-items:center;white-space:nowrap}

    /* Badges */
    .badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;border:1px solid;white-space:nowrap}
    .grade-a{background:#d1fae5;color:#065f46;border-color:#6ee7b7}
    .grade-b{background:#dbeafe;color:#1e40af;border-color:#93c5fd}
    .grade-c{background:#fef3c7;color:#92400e;border-color:#fcd34d}
    .grade-d{background:#ffedd5;color:#9a3412;border-color:#fdba74}
    .grade-f{background:#fee2e2;color:#991b1b;border-color:#fca5a5}
    .type-ind{background:#ede9fe;color:#5b21b6;border-color:#c4b5fd}
    .type-grp{background:#e0f2fe;color:#075985;border-color:#7dd3fc}

    /* Score bar */
    .score-bar-wrap{display:flex;align-items:center;gap:8px;min-width:120px}
    .score-bar-track{flex:1;height:6px;background:#e2e8f0;border-radius:3px;overflow:hidden}
    .score-bar-fill{height:100%;border-radius:3px}
    .score-bar-val{font-weight:700;font-size:13px;min-width:28px;text-align:right}

    /* Pagination */
    .pagination{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--border);font-size:13px;color:var(--text-muted);flex-wrap:wrap;gap:8px}
    .page-btns{display:flex;gap:4px}
    .page-btn{width:32px;height:32px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text-mid);font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:var(--transition)}
    .page-btn:hover{background:var(--bg)}
    .page-btn.active{background:var(--navy);color:#fff;border-color:var(--navy)}
    .page-btn:disabled{opacity:.4;cursor:default}

    /* Back btn */
    .back-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);font-size:13px;font-weight:600;color:var(--text-mid);cursor:pointer;transition:var(--transition)}
    .back-btn:hover{background:var(--bg);color:var(--navy)}

    /* Detail hero */
    .detail-hero{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px 28px;display:flex;align-items:center;gap:20px;margin-bottom:24px;box-shadow:var(--shadow-sm);flex-wrap:wrap}
    .detail-avatar{width:68px;height:68px;border-radius:14px;color:#fff;font-size:22px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .detail-info{flex:1;min-width:0}
    .detail-name{font-size:22px;font-weight:800}
    .detail-project{font-size:13px;color:var(--text-muted);margin-top:3px}
    .detail-tags{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
    .detail-grade-box{text-align:center;padding:16px 24px;border-radius:10px;border:2px solid;flex-shrink:0}
    .detail-grade-letter{font-size:48px;font-weight:800;line-height:1}
    .detail-grade-pct{font-size:16px;font-weight:700;margin-top:2px}
    .detail-grade-lbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-top:2px}

    /* Detail grid */
    .detail-grid{display:grid;grid-template-columns:1fr 320px;gap:20px}
    .detail-left{display:flex;flex-direction:column;gap:18px}
    .detail-right{display:flex;flex-direction:column;gap:18px}

    /* Cards */
    .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden}
    .card-head{padding:14px 20px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
    .card-head-title{font-size:14px;font-weight:700;flex:1}

    /* Criteria table */
    .criteria-table{width:100%;border-collapse:collapse;font-size:13.5px}
    .criteria-table thead th{background:#f8fafc;padding:9px 16px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);border-bottom:1px solid var(--border);text-align:left}
    .criteria-row:not(:last-child) td{border-bottom:1px solid #f1f5f9}
    .criteria-row td{padding:10px 16px;vertical-align:middle}
    .criteria-label{font-weight:500;min-width:140px}
    .criteria-chip{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:700;border:1px solid}
    .criteria-pct{font-weight:700;font-size:12px;text-align:right;width:50px}
    .mini-track{height:5px;background:#e2e8f0;border-radius:3px;overflow:hidden;min-width:80px}
    .mini-fill{height:100%;border-radius:3px}

    /* Summary */
    .summary-body{padding:20px}
    .summary-score-row{display:flex;align-items:baseline;gap:6px;margin-bottom:4px}
    .summary-big{font-size:56px;font-weight:800;line-height:1;letter-spacing:-2px}
    .summary-of{font-size:16px;font-weight:600;color:var(--text-muted);align-self:flex-end;padding-bottom:4px;flex:1}
    .summary-raw{font-size:12px;color:var(--text-muted);margin-bottom:14px}
    .summary-bar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
    .summary-track{flex:1;height:9px;background:#e2e8f0;border-radius:5px;overflow:hidden}
    .summary-fill{height:100%;border-radius:5px}
    .summary-bar-lbl{font-size:13px;font-weight:700;min-width:34px;text-align:right}
    .summary-status{text-align:center;padding:7px 12px;border-radius:6px;font-size:12px;font-weight:700;letter-spacing:.3px}

    /* Eval */
    .eval-body{padding:14px 20px;font-size:13.5px;color:var(--text-mid);line-height:1.75}

    /* Meta */
    .meta-row-item{display:flex;justify-content:space-between;align-items:center;padding:9px 20px;font-size:12.5px;border-bottom:1px solid #f1f5f9}
    .meta-row-item:last-child{border-bottom:none}
    .meta-k{color:var(--text-muted);font-weight:500}
    .meta-v{font-weight:600;text-align:right;max-width:55%}

    /* Comments */
    .comments-toggle-btn{display:flex;align-items:center;justify-content:space-between;width:100%;padding:14px 20px;background:none;border:none;font-family:var(--font);font-size:14px;font-weight:700;color:var(--text);cursor:pointer;transition:background var(--transition)}
    .comments-toggle-btn:hover{background:#f8fafc}
    .comments-body{list-style:none;padding:0 20px 14px}
    .comment-li{display:flex;gap:8px;padding:7px 0;font-size:13.5px;color:var(--text-mid);line-height:1.6;border-bottom:1px dashed #e2e8f0}
    .comment-li:last-child{border-bottom:none}
    .comment-dot{color:var(--navy);font-size:11px;padding-top:4px;flex-shrink:0}

    /* Empty state */
    .empty-state{text-align:center;padding:60px 20px;color:var(--text-muted)}
    .empty-icon{font-size:40px;margin-bottom:12px}
    .empty-msg{font-size:15px;font-weight:600}
    .empty-sub{font-size:13px;margin-top:4px}

    /* Footer */
    .app-footer{background:var(--navy-dark);color:rgba(255,255,255,.5);font-size:12px;text-align:center;padding:14px;margin-top:auto}

    /* PDF hidden target */
    #pdf-target{position:absolute;left:-9999px;top:0;font-family:Arial,sans-serif}

    /* Responsive */
    @media(max-width:900px){
      .detail-grid{grid-template-columns:1fr}
      .stats-row{grid-template-columns:repeat(2,1fr)}
      .page{padding:20px 16px 40px}
      .topnav{padding:0 16px}
    }
    @media(max-width:560px){
      .topnav-sub,.welcome-badge{display:none}
      .detail-hero{flex-direction:column;align-items:flex-start}
      .detail-grade-box{align-self:stretch;text-align:center}
    }
  </style>
</head>
<body>
<div id="root"></div>

<script>
// ── Data ──────────────────────────────────────────────────────
const STUDENTS = [
  { id:"khalid-salim", number:1, name:"Khalid Salim", project:"Online Store Management", type:"Individual", group:null, role:"Full Stack", criteria:[{id:"full_stack",label:"Full Stack",score:13,maxScore:15},{id:"code_quality",label:"Code Quality",score:14,maxScore:15},{id:"functionality",label:"Functionality",score:15,maxScore:15},{id:"ui_ux",label:"UI / UX",score:14,maxScore:15},{id:"database",label:"Database Usage",score:13,maxScore:15},{id:"logic",label:"Logic & Structure",score:12,maxScore:15},{id:"extra",label:"Extra Effort",score:9,maxScore:10}], feedback:"Well-structured Django e-commerce app. Product & Message models confirmed. Views for home, contact, product list & detail. URL routing correct. Used raw SQL cursor alongside ORM — shows initiative beyond basics. Homepage and contact form built and pushed.", effort:"Solo project — all work his own. Built homepage, product pages, contact form. Resolved product page errors. Excellent effort for fundamentals level.", comments:["Strong grasp of Django's MVT pattern demonstrated throughout the project.","Using raw SQL alongside ORM shows curiosity and willingness to go beyond the curriculum.","Minor improvements possible in code comments and inline documentation.","Product page error resolution without assistance reflects solid debugging skills.","Ready to progress to more advanced topics such as authentication and REST APIs."] },
  { id:"vivian-achieng", number:2, name:"Vivian Achieng", project:"Local Job Alert System", type:"Individual", group:null, role:"Backend", criteria:[{id:"full_stack",label:"Full Stack",score:14,maxScore:15},{id:"code_quality",label:"Code Quality",score:14,maxScore:15},{id:"functionality",label:"Functionality",score:15,maxScore:15},{id:"ui_ux",label:"UI / UX",score:14,maxScore:15},{id:"database",label:"Database Usage",score:13,maxScore:15},{id:"logic",label:"Logic & Structure",score:11,maxScore:15},{id:"extra",label:"Extra Effort",score:9,maxScore:10}], feedback:"Most complete individual project in the cohort. Job model with title, company, location, salary, posted_by FK, is_active flag. Views include job_list with Q-based search filter. README documents full setup — venv, migrate, createsuperuser.", effort:"Solo work throughout. Challenged by login implementation but kept working through it. README quality shows professional thinking. Best-documented individual project in the cohort.", comments:["Most complete individual project in the cohort — a benchmark for peers.","Q-based search filter on job_list shows strong understanding of Django ORM querying.","README documentation is at a professional standard.","Challenged by login but persisted and resolved it — shows strong problem-solving character.","Planned employer/seeker dashboards and email alerts show excellent product thinking.","Ready to move into authentication flows, REST APIs, and asynchronous tasks."] },
  { id:"abdallah-hamid", number:3, name:"Abdallah Hamid Suleiman", project:"TalentConnect", type:"Individual", group:null, role:"Full Stack", criteria:[{id:"full_stack",label:"Full Stack",score:13,maxScore:15},{id:"code_quality",label:"Code Quality",score:12,maxScore:15},{id:"functionality",label:"Functionality",score:13,maxScore:15},{id:"ui_ux",label:"UI / UX",score:9,maxScore:15},{id:"database",label:"Database Usage",score:8,maxScore:15},{id:"logic",label:"Logic & Structure",score:12,maxScore:15},{id:"extra",label:"Extra Effort",score:8,maxScore:10}], feedback:"Two repos — polished static HTML/CSS frontend and a separate Django backend with Django 6 + Jupyter environment. Backend views and models exist but are not yet wired to the frontend. Concept is strong: a talent showcase platform.", effort:"Solo effort across two repos. Challenged by video upload and page linking. Good initiative starting the backend separately. Next step: connect the frontend to the Django backend.", comments:["Strong concept — TalentConnect as a talent showcase platform shows product-level thinking.","Polished frontend with logo, nav, hero, and multiple pages is above average.","Django 6 + Jupyter environment setup shows good initiative and curiosity.","The clear next step is wiring the frontend to the Django backend.","Two-repo approach shows awareness of separation of concerns; now bring them together."] },
  { id:"precious-mukiri", number:4, name:"Precious Mukiri", project:"Green Guard — Waste Reporting Platform", type:"Individual", group:null, role:"Frontend", criteria:[{id:"full_stack",label:"Full Stack",score:13,maxScore:15},{id:"code_quality",label:"Code Quality",score:11,maxScore:15},{id:"functionality",label:"Functionality",score:13,maxScore:15},{id:"ui_ux",label:"UI / UX",score:8,maxScore:15},{id:"database",label:"Database Usage",score:8,maxScore:15},{id:"logic",label:"Logic & Structure",score:9,maxScore:15},{id:"extra",label:"Extra Effort",score:8,maxScore:10}], feedback:"Django project set up correctly — GreenGuard settings confirmed. Socially relevant concept: waste reporting for the community. Templates and models partially built. Had server-running challenges but persisted across three progress submissions.", effort:"Three progress updates demonstrate steady commitment. Struggled with server errors but did not give up. Persistence and social impact of the idea are commendable for a beginner.", comments:["Socially relevant concept — a waste reporting platform addresses a real community need.","Django project correctly configured with GreenGuard settings confirmed.","Three progress submissions show consistent engagement.","Server-running challenges are common; persisting through them is the right approach.","Templates and models are partially built — next step is wiring views to complete the CRUD loop."] },
  { id:"briggite-kathambi", number:5, name:"Briggite Kathambi", project:"Donation Platform / Bei-Tracker", type:"Group", group:"Young Developers", role:"Learner", criteria:[{id:"full_stack",label:"Full Stack",score:10,maxScore:15},{id:"code_quality",label:"Code Quality",score:5,maxScore:15},{id:"functionality",label:"Functionality",score:8,maxScore:15},{id:"ui_ux",label:"UI / UX",score:5,maxScore:15},{id:"database",label:"Database Usage",score:5,maxScore:15},{id:"logic",label:"Logic & Structure",score:5,maxScore:15},{id:"extra",label:"Extra Effort",score:6,maxScore:10}], feedback:"Personal repo (briggite/New-Bei-Tracker) was not publicly accessible for review. Joined the Young Developers group and contributed to Bei-Tracker. Score reflects engagement and learning attitude.", effort:"Honestly reported that she was learning things she didn't know — self-awareness is a strength. Participated in group sessions. Next step: push the personal repo public so work can be properly reviewed.", comments:["Self-awareness about what you don't yet know is one of the most important qualities in a developer.","Joined Young Developers group and contributed to Bei-Tracker — that initiative counts.","Personal donation platform is a good idea — shows social and financial thinking.","The single most impactful next step: make the personal repo public.","Score reflects engagement and attitude — a public repo will make a significant difference.","Keep showing up, keep asking questions — the learning curve gets easier."] },
  { id:"ibrahim-ngwaruto", number:6, name:"Ibrahim Ngwaruto", project:"TerraBloom Global", type:"Group", group:"Team Tiger", role:"Backend", criteria:[{id:"full_stack",label:"Full Stack",score:14,maxScore:15},{id:"code_quality",label:"Code Quality",score:14,maxScore:15},{id:"functionality",label:"Functionality",score:14,maxScore:15},{id:"ui_ux",label:"UI / UX",score:12,maxScore:15},{id:"database",label:"Database Usage",score:11,maxScore:15},{id:"logic",label:"Logic & Structure",score:13,maxScore:15},{id:"extra",label:"Extra Effort",score:9,maxScore:10}], feedback:"Farm-to-table platform connecting Kenyan farmers to consumers. index.html polished with correct Django template tags. Backend and database built. LIVE deployment on GitHub Pages. Active challenge: farmer uploads not yet visible to consumers.", effort:"Built backend and database, pushed to live site on GitHub Pages — most visible deployment in the cohort. Helped teammates with Git. Actively solving the farmer-to-consumer data visibility issue.", comments:["Live deployment on GitHub Pages is the most visible delivery in the cohort — sets the bar.","Correct use of Django template tags (url, static) shows solid grasp of the framework.","Polished hero with CTAs demonstrates product thinking beyond just code.","Helping teammates with Git is a leadership quality worth recognising early.","Once uploads are visible to consumers, TerraBloom will be a fully end-to-end platform."] },

const GRADE_SCALE = [
  {min:90,max:100,grade:"A",label:"Excellent",   color:"#065f46",bg:"#d1fae5",border:"#6ee7b7",bar:"#10b981"},
  {min:80,max:89, grade:"B",label:"Good",         color:"#1e40af",bg:"#dbeafe",border:"#93c5fd",bar:"#3b82f6"},
  {min:70,max:79, grade:"C",label:"Satisfactory", color:"#92400e",bg:"#fef3c7",border:"#fcd34d",bar:"#f59e0b"},
  {min:60,max:69, grade:"D",label:"Needs Work",   color:"#9a3412",bg:"#ffedd5",border:"#fdba74",bar:"#f97316"},
  {min:0, max:59, grade:"F",label:"Failing",      color:"#991b1b",bg:"#fee2e2",border:"#fca5a5",bar:"#ef4444"}
];

const AVATAR_COLORS = ["#1e3a5f","#7c3aed","#0891b2","#065f46","#9d174d","#92400e","#1d4ed8","#166534","#7e22ce","#be185d","#0369a1","#0f766e"];

function computeScore(criteria){
  const raw=criteria.reduce((s,c)=>s+c.score,0);
  const possible=criteria.reduce((s,c)=>s+c.maxScore,0);
  const pct=Math.round((raw/possible)*100);
  return {raw,possible,pct};
}
function getGradeInfo(pct){
  return GRADE_SCALE.find(g=>pct>=g.min&&pct<=g.max)||GRADE_SCALE[GRADE_SCALE.length-1];
}

const COMPUTED = STUDENTS.map((s,i)=>{
  const {raw,possible,pct}=computeScore(s.criteria);
  const info=getGradeInfo(pct);
  return {...s,raw,possible,total:pct,grade:info.grade,gradeInfo:info,
    avatarColor:AVATAR_COLORS[i%AVATAR_COLORS.length],
    initials:s.name.split(" ").map(w=>w[0]).join("").slice(0,2)};
});

function gradeCls(g){return{A:'grade-a',B:'grade-b',C:'grade-c',D:'grade-d',F:'grade-f'}[g]||'grade-f';}

function exportCSV(students){
  const hdr=['#','Name','Project','Category','Group','Role','Full Stack','Code Quality','Functionality','UI/UX','Database','Logic','Extra','Total','Grade'];
  const rows=students.map(s=>[s.number,s.name,`"${s.project}"`,s.type,s.group||'-',s.role,...s.criteria.map(c=>c.score),s.total,s.grade]);
  const csv=[hdr,...rows].map(r=>r.join(',')).join('\n');
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
  a.download='grading-report-june-2026.csv';a.click();
}

function Dashboard({onView}){
  const [search,setSearch]=useState('');
  const [sortKey,setSortKey]=useState('number');
  const [sortDir,setSortDir]=useState('asc');
  const [typeF,setTypeF]=useState('all');
  const [gradeF,setGradeF]=useState('all');
  const [page,setPage]=useState(1);
  const PER=8;

  const filtered=COMPUTED.filter(s=>{
    const q=search.toLowerCase();
    return(s.name.toLowerCase().includes(q)||s.project.toLowerCase().includes(q))
      &&(typeF==='all'||s.type===typeF)
      &&(gradeF==='all'||s.grade===gradeF);
  });

  const sorted=[...filtered].sort((a,b)=>{
    let av=a[sortKey],bv=b[sortKey];
    if(typeof av==='string'){av=av.toLowerCase();bv=bv.toLowerCase();}
    if(av<bv)return sortDir==='asc'?-1:1;
    if(av>bv)return sortDir==='asc'?1:-1;
    return 0;
  });

  const totalPg=Math.ceil(sorted.length/PER);
  const paged=sorted.slice((page-1)*PER,page*PER);

  function toggleSort(k){
    if(sortKey===k)setSortDir(d=>d==='asc'?'desc':'asc');
    else{setSortKey(k);setSortDir('asc');}
    setPage(1);
  }

  useEffect(()=>setPage(1),[search,typeF,gradeF]);

  const avg=Math.round(COMPUTED.reduce((s,x)=>s+x.total,0)/COMPUTED.length);
  const top=Math.max(...COMPUTED.map(s=>s.total));

  function Th({label,k}){

      <th onClick={()=>toggleSort(k)}>

      </th>
    );

  return(
    <div className="page">

          <div className="page-sub">June 2026 · {COMPUTED.length} students enrolled</div>

          <button className="btn btn-outline btn-sm" onClick={()=>exportCSV(sorted)}>
            ⬇ Export CSV

            ⬆ Bulk PDF

        <StatCard icon="🏆" value={aCount}          label="Grade A Students" bg="#d1fae5" color="#065f46"/>
        <StatCard icon="⭐" value={top+'%'}         label="Top Score"        bg="#fef3c7" color="#92400e"/>
      </div>

      <div className="toolbar">
        <div className="search-wrap">
          <span className="search-icon">🔍</span>
          <input className="search-input" placeholder="Search by name or project…" value={search} onChange={e=>setSearch(e.target.value)}/>
        </div>
        <select className="filter-select" value={typeF} onChange={e=>setTypeF(e.target.value)}>
          <option value="all">All Categories</option>
          <option value="Individual">Individual</option>
          <option value="Group">Group</option>
        </select>
        <select className="filter-select" value={gradeF} onChange={e=>setGradeF(e.target.value)}>
          <option value="all">All Grades</option>
          {['A','B','C','D','F'].map(g=><option key={g} value={g}>Grade {g}</option>)}
        </select>
      </div>

      <div className="table-card">
        <div className="table-scroll">
          <table>
            <thead>
              <tr>
                <Th label="#" k="number"/>
                <Th label="Student" k="name"/>
                <th>Project</th>
                <Th label="Category" k="type"/>
                <Th label="Score" k="total"/>
                <Th label="Grade" k="grade"/>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              {paged.length===0?(
                <tr><td colSpan="7">
                  <div className="empty-state">

                    </span>
                  </td>
                  <td style={{minWidth:150}}><ScoreBar pct={s.total} color={s.gradeInfo.bar}/></td>
                  <td>
                    <span className={`badge ${gradeCls(s.grade)}`} style={{fontSize:12,padding:'4px 10px'}}>
                      {s.grade} · {s.gradeInfo.label}
                    </span>
                  </td>
                  <td className="td-actions">
                    <button className="btn btn-view btn-sm" onClick={()=>onView(s.id)}>👁 View</button>
                    <button className="btn btn-pdf btn-sm" onClick={()=>generatePDF(s)}>⬇ PDF</button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>

        {totalPg>1&&(
          <div className="pagination">
            <span>Showing {Math.min((page-1)*PER+1,sorted.length)}–{Math.min(page*PER,sorted.length)} of {sorted.length} students</span>
            <div className="page-btns">
              <button className="page-btn" disabled={page===1} onClick={()=>setPage(p=>p-1)}>‹</button>
              {Array.from({length:totalPg},(_,i)=>i+1).map(p=>(
                <button key={p} className={`page-btn${page===p?' active':''}`} onClick={()=>setPage(p)}>{p}</button>
              ))}
              <button className="page-btn" disabled={page===totalPg} onClick={()=>setPage(p=>p+1)}>›</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function StudentDetail({studentId,onBack}){
  const student=COMPUTED.find(s=>s.id===studentId);
  const [open,setOpen]=useState(false);
  if(!student)return<div className="page"><div className="empty-state"><div className="empty-icon">❌</div><div className="empty-msg">Student not found</div><button className="back-btn" style={{marginTop:16}} onClick={onBack}>← Back</button></div></div>;
  const {gradeInfo}=student;
  return(
    <div className="page">
      <div className="page-header">
        <button className="back-btn" onClick={onBack}>← Back to Dashboard</button>
        <button className="btn btn-pdf" onClick={()=>generatePDF(student)}>⬇ Download PDF</button>
      </div>

      <div className="detail-hero">
        <div className="detail-avatar" style={{background:student.avatarColor}}>{student.initials}</div>
        <div className="detail-info">
          <div className="detail-name">{student.name}</div>
          <div className="detail-project">{student.project}</div>
          <div className="detail-tags">
            <span className={`badge ${student.type==='Individual'?'type-ind':'type-grp'}`}>{student.type}{student.group?' · '+student.group:''}</span>
            <span className="badge" style={{background:'#f1f5f9',color:'#475569',borderColor:'#e2e8f0'}}>{student.role}</span>
            <span className="badge" style={{background:'#f1f5f9',color:'#475569',borderColor:'#e2e8f0'}}>June 2026</span>
          </div>
        </div>
        <div className="detail-grade-box" style={{borderColor:gradeInfo.border,background:gradeInfo.bg}}>
          <div className="detail-grade-letter" style={{color:gradeInfo.bar}}>{student.grade}</div>
          <div className="detail-grade-pct" style={{color:gradeInfo.color}}>{student.total}%</div>
          <div className="detail-grade-lbl" style={{color:gradeInfo.bar}}>{gradeInfo.label}</div>
        </div>
      </div>

      <div className="detail-grid">
        <div className="detail-left">
          <div className="card">
            <div className="card-head"><span>📋</span><span className="card-head-title">Grading Breakdown</span></div>
            <div style={{overflowX:'auto'}}>
              <table className="criteria-table">
                <thead><tr><th>Criterion</th><th>Score</th><th>Progress</th><th style={{textAlign:'right'}}>%</th></tr></thead>
                <tbody>
                  {student.criteria.map(c=>{
                    const pct=Math.round((c.score/c.maxScore)*100);
                    const info=getGradeInfo(pct);
                    return(
                      <tr key={c.id} className="criteria-row">
                        <td className="criteria-label">{c.label}</td>
                        <td><span className="criteria-chip" style={{background:info.bg,color:info.color,borderColor:info.border}}>{c.score} / {c.maxScore}</span></td>
                        <td><div className="mini-track" style={{minWidth:90}}><div className="mini-fill" style={{width:`${pct}%`,background:info.bar}}/></div></td>
                        <td className="criteria-pct" style={{color:info.bar}}>{pct}%</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>

          <div className="card">
            <div className="card-head"><span>🧑‍💻</span><span className="card-head-title">Project Evaluation</span></div>
            <div className="eval-body">{student.feedback}</div>
          </div>

          <div className="card">
            <div className="card-head"><span>🎯</span><span className="card-head-title">Student Effort</span></div>
            <div className="eval-body">{student.effort}</div>
          </div>

          <div className="card">
            <button className="comments-toggle-btn" onClick={()=>setOpen(o=>!o)}>
              <span>Instructor Comments</span>
              <span>{open?'▲':'▼'}</span>
            </button>
            {open&&(
              <ul className="comments-body">
                {student.comments.map((c,i)=>(
                  <li key={i} className="comment-li"><span className="comment-dot">▸</span>{c}</li>
                ))}
              </ul>
            )}
          </div>
        </div>

        <div className="detail-right">
          <div className="card">
            <div className="card-head"><span>📊</span><span className="card-head-title">Score Summary</span></div>
            <div className="summary-body" style={{borderTop:`4px solid ${gradeInfo.bar}`}}>
              <div className="summary-score-row">
                <div className="summary-big" style={{color:gradeInfo.bar}}>{student.total}</div>
                <div className="summary-of">/ 100</div>
                <span className={`badge ${gradeCls(student.grade)}`} style={{fontSize:15,padding:'4px 12px'}}>{student.grade}</span>
              </div>
              <div className="summary-raw">Raw: {student.raw} / {student.possible} points</div>
              <div className="summary-bar">
                <div className="summary-track"><div className="summary-fill" style={{width:`${student.total}%`,background:gradeInfo.bar}}/></div>
                <span className="summary-bar-lbl" style={{color:gradeInfo.bar}}>{student.total}%</span>
              </div>
              <div className="summary-status" style={{color:gradeInfo.color,background:gradeInfo.bg}}>{gradeInfo.label}</div>
            </div>
          </div>

          <div className="card">
            <div className="card-head"><span>ℹ️</span><span className="card-head-title">Student Info</span></div>
            {[['Course','Web Dev Fundamentals'],['Category',student.type],['Group',student.group||'N/A'],['Role',student.role],['Submitted','June 2026'],['Stack','Django / Python'],['Evaluator','Course Instructor']].map(([k,v])=>(
              <div key={k} className="meta-row-item"><span className="meta-k">{k}</span><span className="meta-v">{v}</span></div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

function App(){
  const [page,setPage]=useState('dashboard');
  const [selected,setSelected]=useState(null);
  const [dark,setDark]=useState(false);

  useEffect(()=>{document.body.classList.toggle('dark-mode',dark);},[dark]);

  function handleView(id){setSelected(id);setPage('detail');window.scrollTo(0,0);}
  function handleBack(){setPage('dashboard');setSelected(null);window.scrollTo(0,0);}

  return(
    <div className="app-shell">
      <TopNav dark={dark} onDark={()=>setDark(d=>!d)}/>
      {page==='dashboard'?<Dashboard onView={handleView}/>:<StudentDetail studentId={selected} onBack={handleBack}/>}
      <footer className="app-footer">
        Student Grading Management System · Web Development Fundamentals · June 2026
      </footer>
      <div id="pdf-target" style={{position:'absolute',left:'-9999px',top:0}}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
